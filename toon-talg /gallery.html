<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرض الأعمال | TOON TALG</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc; min-height: 100vh; padding: 20px;
      display: flex; flex-direction: column; align-items: center;
    }
    header {
      width: 100%; max-width: 1100px; display: flex; justify-content: space-between;
      align-items: center; padding: 15px 25px; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px);
      border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 30px;
    }
    .logo-text { font-size: 26px; font-weight: 900; color: #ff8c00; letter-spacing: 1px; }
    .logo-text span { color: #38bdf8; }
    nav a { color: #cbd5e1; text-decoration: none; margin-right: 20px; font-weight: bold; transition: 0.3s; }
    nav a:hover { color: #ff8c00; }

    h1 { margin-bottom: 10px; font-size: 36px; text-align: center; color: #ffffff; }
    p.subtitle { color: #94a3b8; margin-bottom: 40px; text-align: center; font-size: 16px; }

    .gallery-grid {
      display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; max-width: 1100px; width: 100%;
    }
    .video-card {
      background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px; overflow: hidden; width: 340px;
      display: flex; flex-direction: column; transition: 0.3s;
    }
    .video-card:hover { transform: translateY(-5px); border-color: #ff8c00; box-shadow: 0 8px 25px rgba(255, 140, 0, 0.25); }
    
    .video-card video {
      width: 100%; height: 220px; object-fit: cover; background: #000;
    }
    .video-info { padding: 15px 20px; text-align: center; }
    .video-info h3 { color: #f8fafc; font-size: 18px; margin-bottom: 8px; }
    .video-info p { color: #94a3b8; font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <div class="logo-text">TOON <span>TALG</span></div>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="packages.html">الباقات والأسعار</a>
      <a href="gallery.html" style="color: #ff8c00;">معرض الأعمال</a>
    </nav>
  </header>

  <h1>معرض أعمالنا</h1>
  <p class="subtitle">نماذج من قصص الأنيميشن والكرتون التي قمنا بتنفيذها لعملائنا</p>

  <div class="gallery-grid">

    <!-- الفيديو الخاص بكِ -->
    <div class="video-card">
      <video controls preload="metadata">
        <source src="docs/1111111111.mp4" type="video/mp4">
        متصفحك لا يدعم تشغيل الفيديو.
      </video>
      <div class="video-info">
        <h3>قصة أنيميشن مميزة</h3>
        <p>نموذج عمل كرتوني متكامل من تنفيذ TOON TALG</p>
      </div>
    </div>

  </div>

</body>
</html>
