    <!-- محتوى الويب سايت يبدأ هنا -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    
    header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 40px;
    }
    .logo-text { font-size: 26px; font-weight: 900; color: #ff8c00; letter-spacing: 1px; }
    .logo-text span { color: #38bdf8; }
    nav a {
      color: #cbd5e1;
      text-decoration: none;
      margin-right: 20px;
      font-weight: bold;
      transition: 0.3s;
    }
    nav a:hover, nav a.active { color: #ff8c00; }

    .page-title { text-align: center; margin-bottom: 40px; }
    .page-title h1 { font-size: 36px; color: #ffffff; margin-bottom: 10px; }
    .page-title h1 span { color: #ff8c00; }
    .subtitle { color: #94a3b8; font-size: 16px; }

    /* شبكة معرض الأعمال */
    .gallery-grid {
      display: flex;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
      width: 100%;
      max-width: 1100px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 50px;
    }

    .video-card {
      background: #1e293b;
      border-radius: 15px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      width: 320px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      transition: transform 0.3s ease;
    }
    .video-card:hover { transform: translateY(-5px); }

    .video-wrapper {
      position: relative;
      padding-bottom: 177.78%;
      height: 0;
      overflow: hidden;
      background: #000;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-info { padding: 15px; text-align: center; }
    .video-info h3 { color: #ff8c00; font-size: 18px; margin-bottom: 5px; }
    .video-info p { color: #94a3b8; font-size: 13px; }

    footer {
      margin-top: auto;
      text-align: center;
      color: #64748b;
      font-size: 14px;
      padding: 20px 0;
    }
  </style>

  <header>
    <div class="logo-text">TOON <span>TALG</span></div>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="packages.html">الباقات والأسعار</a>
      <a href="gallery.html" class="active">معرض الأعمال</a>
    </nav>
  </header>

  <div class="page-title">
    <h1>معرض <span>أعمالنا</span> 🎬</h1>
    <p class="subtitle">نماذج متجددة من قصص الأنيميشن والكرتون التي قمنا بتنفيذها لعملائنا</p>
  </div>

  <div class="gallery-grid">

    <!-- نموذج فيديو 1 -->
    <div class="video-card">
      <div class="video-wrapper">
        <iframe src="https://www.youtube.com/embed/k4CFLTnwO1M" title="نموذج أنيميشن 1" allowfullscreen></iframe>
      </div>
      <div class="video-info">
        <h3>قصة أنيميشن مميزة #1</h3>
        <p>TOON TALG نموذج عمل كرتوني متكامل من تنفيذ</p>
      </div>
    </div>

    <!-- نموذج فيديو 2 (الجديد) -->
    <div class="video-card">
      <div class="video-wrapper">
        <iframe src="https://www.youtube.com/embed/V3YYvnSKavA" title="نموذج أنيميشن 2" allowfullscreen></iframe>
      </div>
      <div class="video-info">
        <h3>قصة أنيميشن مميزة #2</h3>
        <p>TOON TALG نموذج إعلان وتحريك كرتوني من تنفيذ</p>
      </div>
    </div>

  </div>

  <footer>
    جميع الحقوق محفوظة © TOON TALG
  </footer>
